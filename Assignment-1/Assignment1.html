<!DOCTYPE html>
<html>

<head>
    <title>Bank Customer Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #4138c0;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        p {
            font-size: 18px;
        }

        input {
            width: 95%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background: darkblue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: navy;
        }

        #history {
            margin-top: 20px;
            background: #eeeeee;
            padding: 10px;
        }

        ul {
            padding-left: 20px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Bank Customer Page</h1>
        <h3>Register New Customer</h3>

        <input type="text" id="newName" placeholder="Enter Customer Name">

        <input type="text" id="newAccount" placeholder="Enter Account Number">

        <input type="number" id="openingBalance" placeholder="Enter Opening Balance">

        <button onclick="registerCustomer()">Register Customer</button>

        <hr>

        <p><b>Customer Name:</b> <span id="name"></span></p>

        <p><b>Account Number:</b> <span id="account"></span></p>

        <p><b>Current Balance:</b> ₹<span id="balance"></span></p>

        <input type="number" id="amount" placeholder="Enter Amount">

        <br>

        <button onclick="depositMoney()">Deposit</button>

        <button onclick="withdrawMoney()">Withdraw</button>

        <button onclick="showBalance()">Check Balance</button>

        <div id="history">
            <h3>Transaction History</h3>

            <ul id="list">

            </ul>

        </div>

    </div>

    <script>

        let customerName = "Rahul Sharma";
        let accountNumber = "1234567890";
        let balance = 5000;

        document.getElementById("name").innerHTML = customerName;
        document.getElementById("account").innerHTML = accountNumber;
        document.getElementById("balance").innerHTML = balance;

        alert("Welcome " + customerName);
        function registerCustomer() {
            let newName = document.getElementById("newName").value;
            let newAccount = document.getElementById("newAccount").value;
            let openingBalance = Number(document.getElementById("openingBalance").value);

            if (newName == "" || newAccount == "") {
                alert("Please fill all the details.");
                return;
            }

            if (openingBalance < 0) {
                alert("Opening balance cannot be negative.");
                return;
            }

            customerName = newName;
            accountNumber = newAccount;
            balance = openingBalance;

            document.getElementById("name").innerHTML = customerName;
            document.getElementById("account").innerHTML = accountNumber;
            document.getElementById("balance").innerHTML = balance;

            document.getElementById("list").innerHTML = "";

            let item = document.createElement("li");
            item.innerHTML = "Customer Registered with Opening Balance ₹" + balance;
            document.getElementById("list").appendChild(item);

            document.getElementById("newName").value = "";
            document.getElementById("newAccount").value = "";
            document.getElementById("openingBalance").value = "";

            alert("Customer Registered Successfully");
        }
        function depositMoney() {
            let amount = Number(document.getElementById("amount").value);

            if (amount <= 0) {
                alert("Enter a valid amount");
                return;
            }

            balance = balance + amount;

            document.getElementById("balance").innerHTML = balance;

            let item = document.createElement("li");
            item.innerHTML = "Deposited ₹" + amount;
            document.getElementById("list").appendChild(item);

            alert("Amount Deposited Successfully");

            document.getElementById("amount").value = "";
        }

        function withdrawMoney() {
            let amount = Number(document.getElementById("amount").value);

            if (amount <= 0) {
                alert("Enter a valid amount");
                return;
            }

            if (amount > balance) {
                alert("Insufficient Balance");
                return;
            }

            balance = balance - amount;

            document.getElementById("balance").innerHTML = balance;

            let item = document.createElement("li");
            item.innerHTML = "Withdrawn ₹" + amount;
            document.getElementById("list").appendChild(item);

            alert("Withdrawal Successful");

            document.getElementById("amount").value = "";
        }

        function showBalance() {
            alert("Current Balance is ₹" + balance);
        }

    </script>

</body>

</html>
